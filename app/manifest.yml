# Article25: the privacy review desk that lives inside Jira.
# Product app (Stage 3 foundation). Every scope below has a documented purpose in product/STAGE3_FOUNDATION_RESULTS.md.
modules:
  jira:issuePanel:
    - key: privacy-panel
      resource: panel
      resolver:
        function: resolver
      title: Privacy
      icon: resource:panel;icon.svg
  jira:globalPage:
    - key: desk
      resource: desk
      resolver:
        function: resolver
      title: Article25
      icon: resource:desk;icon.svg
  # M4 ENFORCE: the Article25 privacy gate. Admins add it to the transitions they want to protect
  # (Jira's workflow editor → Validate details → Marketplace rules). It reads only Article25's own
  # records (Forge SQL) and the work item's current text (as the app). Monitor mode by default.
  jira:workflowValidator:
    - key: article25-gate
      name: Article25 privacy gate
      description: Stops this transition unless an Article25 reviewer has approved the current text of the work item.
      function: gate-fn
      errorMessage: "Article25: the privacy decision for this work item could not be confirmed, so the transition was stopped."
      projectTypes:
        - company-managed
        - team-managed
  # M2 DETECT: screening pipeline (trigger → queue → consumer), schema, reconciler.
  trigger:
    - key: issue-events
      function: issue-events-fn
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue
      filter:
        ignoreSelf: true
    - key: lifecycle
      function: lifecycle-fn
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  consumer:
    - key: screening-consumer
      queue: a25-screening
      function: screening-consumer-fn
    - key: maintenance-consumer
      queue: a25-maintenance
      function: maintenance-consumer-fn
  scheduledTrigger:
    - key: reconcile
      function: reconcile-fn
      interval: fiveMinute
  sql:
    - key: main
      engine: mysql
  # Forge LLM (Atlassian-hosted; no external egress). Approved for development on 22 Nov 2026.
  # Calls are gated by A25_AI_ENABLED, a daily call budget and a hard spend cap (A25_AI_SPEND_CAP_USD).
  llm:
    - key: extraction
      model:
        - claude
  function:
    - key: resolver
      handler: index.handler
    - key: issue-events-fn
      handler: index.onIssueEvent
    - key: lifecycle-fn
      handler: index.onLifecycle
    - key: screening-consumer-fn
      handler: index.screeningConsumer
      timeoutSeconds: 120
    - key: maintenance-consumer-fn
      handler: index.maintenanceConsumer
      timeoutSeconds: 300
    - key: reconcile-fn
      handler: index.reconcileSchedule
    - key: gate-fn
      handler: index.gateValidator
resources:
  - key: panel
    path: frontend/dist/panel
  - key: desk
    path: frontend/dist/desk
permissions:
  scopes:
    - read:jira-work
    - read:jira-user # M3: reviewer-group membership, reviewer names, separation of duties
    - read:workflow:jira # M4: read-only; admin health check finds which workflow transitions carry the Article25 gate (approved 23 Nov 2026)
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/a2030a0d-5fd0-4ace-8ff5-7cdbfdba0cd1

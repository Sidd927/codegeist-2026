<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- YouTube thumbnail for the Article25 demo film. One still frame, same palette, type and icon
     as the film. Snapshot at 0.5 s, then scale to 1280×720 (see VIDEO_PRODUCTION_NOTES.md). -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #121318; }
#root { position: relative; width: 100%; height: 100%; background: radial-gradient(1200px 800px at 30% 40%, #1B1D25 0%, #121318 60%, #0B0C10 100%); }
.mark { position: absolute; left: 150px; top: 250px; display: flex; align-items: center; gap: 44px; }
.mark img { width: 150px; height: 150px; }
.word { font: 600 190px/1 'EB Garamond', serif; color: #F3F0E8; letter-spacing: -.015em; }
.promise { position: absolute; left: 150px; top: 520px; width: 900px; font: 500 84px/1.12 'EB Garamond', serif; color: #E7E2D6; }
.promise em { font-style: normal; color: #121318; background: linear-gradient(transparent 12%, #E9B93A 12%, #E9B93A 92%, transparent 92%); padding: 0 .08em; }
.chips { position: absolute; left: 1180px; top: 300px; display: flex; flex-direction: column; gap: 34px; }
.chip { font: 700 52px/1 'Inter', sans-serif; padding: 26px 36px; border-radius: 14px; width: max-content; }
.ok { background: #DCEFD9; color: #1F5E2A; text-decoration: line-through 6px rgba(201,55,44,.9); }
.bad { background: #C9372C; color: #FFFFFF; }
.gate { background: #F3F0E8; color: #17181C; }
.arrow { font: 600 64px/1 'Inter', sans-serif; color: #E9B93A; padding-left: 36px; }
.foot { position: absolute; left: 150px; bottom: 110px; font: 600 34px/1 'Inter', sans-serif; letter-spacing: .22em; color: #8E909A; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1920" data-height="1080">
  <div id="t-mark" class="clip mark" data-start="0" data-duration="1" data-track-index="1"><img src="assets/article25-icon.svg" alt="" /><span class="word">Article25</span></div>
  <div id="t-promise" class="clip promise" data-start="0" data-duration="1" data-track-index="2">Privacy review that <em>actually enforces</em> the decision.</div>
  <div id="t-chips" class="clip chips" data-start="0" data-duration="1" data-track-index="3">
    <div class="chip ok">Approved</div>
    <div class="arrow">↓ text changed</div>
    <div class="chip bad">Approval invalidated</div>
    <div class="chip gate">Jira gate: blocked</div>
  </div>
  <div id="t-foot" class="clip foot" data-start="0" data-duration="1" data-track-index="4">Jira · Atlassian Forge · Codegeist 2026</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>window.__timelines = window.__timelines || {}; window.__timelines["thumb"] = gsap.timeline({ paused: true });</script>
</body>
</html>
